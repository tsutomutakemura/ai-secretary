<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>カレンダーテスト</title>
<style>
body{font-family:sans-serif;max-width:600px;margin:20px auto;padding:0 16px;line-height:1.7;}
textarea{width:100%;height:80px;}
button{padding:10px 20px;font-size:15px;margin:8px 0;cursor:pointer;}
#result{background:#f4f4f4;padding:14px;border-radius:6px;white-space:pre-wrap;margin-top:12px;}
input{padding:8px;margin:4px 0;width:100%;box-sizing:border-box;font-size:15px;}
label{font-size:14px;color:#555;display:block;margin-top:8px;}
</style></head>
<body>
<h2>カレンダー連携テスト</h2>
<p>① さっきコピーしたアクセストークンを貼ってください：</p>
<textarea id="token" placeholder="ここにトークンを貼り付け"></textarea>

<h3>📖 今週の予定を読む</h3>
<button onclick="readEvents()">予定を読み込む</button>

<h3>➕ 予定を登録する</h3>
<label>予定のタイトル</label>
<input id="title" placeholder="例：テスト会議">
<label>開始日時</label>
<input id="start" type="datetime-local">
<label>終了日時</label>
<input id="end" type="datetime-local">
<button onclick="addEvent()">予定を登録する</button>

<div id="result"></div>

<script>
const api = '/api/calendar';
function token(){ return document.getElementById('token').value.trim(); }
function show(x){ document.getElementById('result').textContent = typeof x==='string'?x:JSON.stringify(x,null,2); }

// 起動時、開始・終了に「次の正時」と「その1時間後」を初期セット
window.addEventListener('DOMContentLoaded', ()=>{
  const now = new Date();
  now.setMinutes(0,0,0);
  now.setHours(now.getHours()+1);
  const end = new Date(now.getTime()+60*60*1000);
  document.getElementById('start').value = toLocal(now);
  document.getElementById('end').value = toLocal(end);
});
function toLocal(d){
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

async function readEvents(){
  show('読み込み中...');
  try{
    const r = await fetch(api, { headers:{ Authorization:'Bearer '+token() }});
    const d = await r.json();
    if(d.events){
      if(d.events.length===0){ show('今週の予定はありません。'); return; }
      show(d.events.map(e=>`・${e.title}\n   ${e.start}`).join('\n\n'));
    } else { show(d); }
  }catch(e){ show('エラー：'+e.message); }
}

async function addEvent(){
  let s = document.getElementById('start').value;
  let e = document.getElementById('end').value;
  if(!s){ show('開始日時を選んでください。'); return; }
  // 終了が未入力、または開始以前なら、開始の1時間後に自動修正
  if(!e || e <= s){
    const d = new Date(s);
    d.setHours(d.getHours()+1);
    const p=n=>String(n).padStart(2,'0');
    e = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
    document.getElementById('end').value = e;
  show('登録中...');
  try{
    const r = await fetch(api, {
      method:'POST',
      headers:{ 'Authorization':'Bearer '+token(), 'Content-Type':'application/json' },
      body: JSON.stringify({
        title: document.getElementById('title').value || '(タイトルなし)',
        start: s + ':00',
        end: e + ':00',
      })
    });
    const d = await r.json();
    if(d.ok){ show('✅ 登録できました！\n'+d.link); }
    else { show(d); }
  }catch(e){ show('エラー：'+e.message); }
}
</script>
</body>
</html>
